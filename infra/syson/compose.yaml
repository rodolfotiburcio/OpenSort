# Adaptado del despliegue local oficial de SysON v2026.11.0.
# Entorno de modelado independiente del simulador Python.
name: opensort-syson

services:
  database:
    image: postgres:15.20
    environment:
      POSTGRES_DB: opensort
      POSTGRES_USER: opensort
      POSTGRES_PASSWORD: ${SYSON_DB_PASSWORD:-opensort-local-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensort -d opensort"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: eclipsesyson/syson:v2026.11.0
    ports:
      - "127.0.0.1:${SYSON_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/opensort
      SPRING_DATASOURCE_USERNAME: opensort
      SPRING_DATASOURCE_PASSWORD: ${SYSON_DB_PASSWORD:-opensort-local-only}
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "http://localhost:${SYSON_PORT:-8080},http://127.0.0.1:${SYSON_PORT:-8080}"
      SERVER_PORT: "8080"
      # Elasticsearch es opcional y no forma parte de este entorno local.
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    depends_on:
      database:
        condition: service_healthy

volumes:
  database:
