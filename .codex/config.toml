# Configuración de proyecto para Codex. Ver docs/mcp.md.
# Conexiones opcionales: ninguna se inicia con enabled = false.
# No modifica el modelo, los permisos ni la configuración global del usuario.

[mcp_servers.opensort_openai_docs]
url = "https://developers.openai.com/mcp"
enabled = false

[mcp_servers.opensort_github_readonly]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "OPENSORT_GITHUB_MCP_TOKEN"
http_headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,issues,pull_requests" }
enabled = false
